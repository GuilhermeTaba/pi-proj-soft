name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml



      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "guilhermetaba"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: guilhermetaba/pi-proj-soft:${{ github.sha }}


      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop pi-proj-soft
            docker rm --force pi-proj-soft
            docker run -d --name pi-proj-soft --network rede-pi -e DB_HOST=postgres-pi -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' -p 8080:8080 guilhermetaba/pi-proj-soft:${{ github.sha }}